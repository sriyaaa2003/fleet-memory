# Every tunable of the experiment lives here. Thresholds are fixed on the validation period, never on the test period.
seed: 7

data:
  raw_dir: data/raw/ved            # weekly CSVs of the Vehicle Energy Dataset (Oh, Leblanc, Peng 2022)
  passes_file: data/passes.parquet
  cell_lat_deg: 0.0015             # ~167 m
  cell_lon_deg: 0.0020             # ~165 m at 42.3 N (Ann Arbor)
  heading_bins: 4                  # the same square in opposite directions is a different road cell
  min_records_per_pass: 3
  min_speed_records: 3

periods:                           # day numbers counted from 2017-11-01
  train_days: [0, 150]             # free-flow speed and the static prior are learned here
  val_days: [150, 240]             # the fusion model and the warning threshold are fitted here
  test_days: [240, 365]

condition:
  min_train_passes: 60             # a road cell needs this many training passes to be scored
  free_flow_quantile: 0.85         # free-flow speed of a cell = this quantile of its pass speeds in the training period
  min_free_flow_kmh: 40.0          # drop car parks and side streets
  slow_ratio: 0.6                  # a pass is "slow" when its mean speed is below this share of free flow

memory:
  half_life_s: 600.0               # evidence halves every 10 minutes
  prior_weight: 1.0                # the static prior counts as this many observations
  last_window_s: 1800.0            # "last pass" baseline looks back this far

static:
  hour_block: 3                    # hours per time-of-day bucket (weekday / weekend x block)
  smoothing: 10.0                  # pseudo-count pulling a bucket towards the cell's overall slow rate

evaluate:
  fleet_fractions: [0.1, 0.25, 0.5, 1.0]   # share of vehicles whose passes feed the memory
  warn_precision: 0.5              # warning threshold: the loosest one with this precision on the validation period
  n_boot: 200
  fresh_n_eff: 0.5                 # a query has "fresh evidence" when the decayed pass count is at least this
